name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Rendering tests must find a graphics adapter instead of skipping.
  DP_REQUIRE_GPU: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p drawpaint
      - uses: actions/upload-artifact@v4
        with:
          name: drawpaint-windows-x64
          path: target/release/drawpaint.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Temporary: the session tests crashed once with SIGSEGV and passed on
      # the next run. Repeat them under gdb until a crash yields a backtrace.
      - name: Hunt intermittent crash
        if: always()
        run: |
          sudo apt-get install -y gdb > /dev/null
          dpkg -l | grep -E "mesa-vulkan|libllvm" || true
          bin=$(find target/debug/deps -maxdepth 1 -name 'drawpaint-*' -type f -executable | head -1)
          for attempt in $(seq 1 40); do
            gdb -batch -ex run -ex "thread apply all bt 30" --args "$bin" > gdb.log 2>&1 || true
            if grep -q "SIGSEGV\|SIGABRT\|SIGBUS" gdb.log; then
              echo "::group::crash on attempt $attempt"
              tail -250 gdb.log
              echo "::endgroup::"
              exit 1
            fi
          done
          echo "no crash in 40 attempts"
