name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Rendering tests must find a graphics adapter instead of skipping.
  DP_REQUIRE_GPU: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p drawpaint
      - uses: actions/upload-artifact@v4
        with:
          name: drawpaint-windows-x64
          path: target/release/drawpaint.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Temporary: capture a backtrace for the crash seen in the session tests.
      - name: Diagnose crash
        if: failure()
        run: |
          sudo apt-get install -y gdb
          dpkg -l | grep -E "mesa-vulkan|libllvm" || true
          bin=$(find target/debug/deps -maxdepth 1 -name 'drawpaint-*' -type f -executable | head -1)
          for attempt in 1 2 3 4 5; do
            gdb -batch -ex run -ex "thread apply all bt 30" --args "$bin" 2>&1 | tail -120
          done
